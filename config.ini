# ChatGPT 代理助手配置
# 端口为 Clash Verge 的混合端口（默认 7897）

[proxy]
# 若 Clash 跑在局域网另一台机器上，把 host 改成对方 IP（如 192.168.1.10），
# 并确保对方已开启「允许局域网连接」、防火墙放行该端口。
host=127.0.0.1
port=7897
# 配置端口不通时，依次尝试这些端口（逗号分隔）
fallback_ports=7897,7890,7891,10808,10809,1080
# 注入给 Chromium 的 --proxy-bypass-list（分号分隔）
bypass_list=localhost;127.0.0.1;[::1];<local>
# 注入给子进程的 NO_PROXY（逗号分隔），必须包含本地 127.0.0.1，避免本地网关被代理
no_proxy=127.0.0.1,localhost,::1
# 启动前用 HTTP CONNECT 验证代理是否真的能出网
verify_connect=true
# CONNECT 验证目标主机和端口（默认 chatgpt.com:443）
verify_host=chatgpt.com:443

[target]
package_name=OpenAI.Codex
alias_name=chatgpt-desktop.exe
# 可选：手动指定 ChatGPT.exe 的真实路径（留空则自动使用 MSIX 执行别名）
exe_path=
# 追加到命令行的额外 Chromium 参数（留空即可）
extra_args=

[clash]
# 是否启用 Clash 联动（读取模式/节点、切换节点、TUN）
enabled=true
# Clash 端口就绪且 ChatGPT 未运行时自动启动（默认关）
auto_launch=false
# 手动指定 mihomo API 命名管道名（留空则自动发现）
pipe_name=
# 可选：Clash HTTP 外部控制地址（如 http://127.0.0.1:9097 或 http://192.168.1.10:9097）；
# 填写后优先走 HTTP API（支持局域网与所有 Clash 客户端），留空则走本机命名管道
api_url=
# 可选：Clash HTTP 外部控制密钥（对应 external-controller 的 secret）
api_secret=

[guard]
# 守护模式：托盘发现 ChatGPT 运行却没走代理（例如从开始菜单启动）时弹出提示
enabled=true
# 发现直连时自动关闭并重启为代理（会中断当前会话，默认关）
auto_takeover=false

[ui]
refresh_seconds=3
verify_seconds=8
